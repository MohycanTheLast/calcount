# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Výchozí hodnoty volitelných env proměnných (lze přepsat v .env.local / na serveru)
    env(AI_DAILY_LIMIT): '50'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\OpenAiClient:
        arguments:
            $openAiApiKey: '%env(OPENAI_API_KEY)%'


    App\EventListener\JwtRefreshResponseListener:
        arguments:
            $accessTokenTtlSeconds: '%lexik_jwt_authentication.token_ttl%'
        tags:
            - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse }

    App\Security\AccessTokenProvider:
        arguments:
            $accessTokenTtlSeconds: '%lexik_jwt_authentication.token_ttl%'
            $refreshTokenTtlSeconds: '%gesdinet_jwt_refresh_token.ttl%'

    # Externí přihlášení – bez nastaveného client ID je endpoint vypnutý (404). Víc ID oddělit čárkou.
    App\Security\GoogleIdTokenVerifier:
        arguments:
            $clientIds: '%env(default::GOOGLE_CLIENT_IDS)%'

    App\Security\AppleIdTokenVerifier:
        arguments:
            $clientIds: '%env(default::APPLE_CLIENT_IDS)%'

    App\Service\AiUsageLimiter:
        arguments:
            $dailyLimit: '%env(int:AI_DAILY_LIMIT)%'
