services:
    php:
#        image: registry.gitlab.finforce.cz/finforce/php-containers/php-dev:8.4-apache
        ports:
            - '80:80'
        volumes:
            - .:/var/www/html
        build:
            context: ./php
        depends_on:
            - mysql
    mysql:
        platform: linux/x86_64
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        env_file:
            - .env.docker.local
        environment:
            MYSQL_DATABASE: calcount
        ports:
            - '127.0.0.1:3306:3306' # DB jen z tohoto počítače, ne z celé sítě
        volumes:
            - calcount-mysql:/var/lib/mysql
volumes:
    calcount-mysql:

